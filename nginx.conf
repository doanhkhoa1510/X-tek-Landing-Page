# each language answers a missing page with its own 404; the prefixes follow src/i18n/config.ts
map $uri $not_found {
    default /404.html;
    ~^/(?<locale>vi|zh|ja|ar|fr|hi)/ /$locale/404/index.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the container sits behind a mapped port; relative redirects keep it (/about-us -> /about-us/)
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # old WordPress URLs: renamed pages, and theme demo pages that no longer exist
    location ~ ^/faq/?$ { return 301 /faqs/; }
    location ~ ^/jobs_category/ { return 301 /careers/; }
    location ~ ^/(services|service-details|projects|project-details|team|team-details|pricing|blog|hello-world|category|feed|comments)(/|$) { return 301 /; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 $not_found;
}
