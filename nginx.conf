# each language answers a missing page with its own 404; the prefixes follow src/i18n/config.ts
map $uri $not_found {
    default /404.html;
    ~^/(?<locale>vi|zh|ja|ar|fr|hi)/ /$locale/404/index.html;
}

# briefs per visitor: 5 a minute, a burst of 5 more, then 429
limit_req_zone $binary_remote_addr zone=brief:1m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the container sits behind a mapped port; relative redirects keep it (/about-us -> /about-us/)
    absolute_redirect off;

    # behind a reverse proxy on a private network, the visitor's address comes from X-Forwarded-For
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # old WordPress URLs: renamed pages, and theme demo pages that no longer exist
    location ~ ^/faq/?$ { return 301 /faqs/; }
    location ~ ^/jobs_category/ { return 301 /careers/; }
    location ~ ^/(services|service-details|projects|project-details|team|team-details|pricing|blog|hello-world|category|feed|comments)(/|$) { return 301 /; }

    # the brief form posts here; the mailer service (compose.yaml) turns it into an email.
    # Docker's DNS resolves "mailer" per request, so the site still starts and serves without it (the form then reports a failure)
    location = /api/contact {
        limit_req zone=brief burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $mailer http://mailer:3000;
        proxy_pass $mailer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # pages: the Cloudflare edge keeps them 5 minutes (needs its Cache Rule "eligible for cache"), browsers revalidate every visit,
    # so a deploy shows within 5 minutes and visitors never wait on the tunnel to this server
    location / {
        add_header Cache-Control "public, max-age=0, s-maxage=300";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 $not_found;
}
