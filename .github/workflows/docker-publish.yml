name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the contact form's mailer (compose.yaml), published next to the site as <image>-mailer
      - id: meta-mailer
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}-mailer
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: mailer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-mailer.outputs.tags }}
          labels: ${{ steps.meta-mailer.outputs.labels }}
          cache-from: type=gha,scope=mailer
          cache-to: type=gha,mode=max,scope=mailer
